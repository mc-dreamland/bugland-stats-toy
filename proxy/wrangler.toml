name = "bjd-toy-proxy"
main = "worker.js"
compatibility_date = "2026-11-01"

# workers.dev 域名上 Cache API 不生效，生产环境请绑定自定义域名，例如：
# routes = [{ pattern = "bjd-api.example.com", custom_domain = true }]

[vars]
ALLOWED_ORIGINS = "https://www.bilibilitoy.com,https://www.bilibili.com,https://m.bilibili.com"

# 仅检查缓存未命中的请求。Cloudflare 按数据中心分别计数，额度为近似值。
# X-Toy-User 和 X-Toy-Tier 由客户端自报，可被伪造。
[[ratelimits]]
name = "RL_IP"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 40
  period = 60

[[ratelimits]]
name = "RL_USER_BASIC"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 10
  period = 60

[[ratelimits]]
name = "RL_USER_TRIPLE"
namespace_id = "1003"

  [ratelimits.simple]
  limit = 20
  period = 60

# Token 用 secret 保存，不要写进本文件：
#   npx wrangler secret put BJD_TOKEN
