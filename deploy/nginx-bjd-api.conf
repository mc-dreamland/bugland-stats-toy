# /etc/nginx/sites-available/bjd-api.conf
# 把 api.example.com 换成你的域名；HTTPS 由 certbot --nginx 自动补上

# 记录 Origin，上线后用来确认 B站 App 实际发出的来源
log_format bjd_api '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                   'origin="$http_origin" cache=$upstream_http_x_proxy_cache rt=$request_time';

# 外层防洪：每 IP 每秒 5 个请求（含缓存命中），突发 20
limit_req_zone $binary_remote_addr zone=bjd_api:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    access_log /var/log/nginx/bjd-api.access.log bjd_api;
    error_log  /var/log/nginx/bjd-api.error.log;

    client_max_body_size 4k;

    location /v2/ {
        limit_req zone=bjd_api burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }

    location / {
        return 404;
    }
}
